name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openpyxl==3.1.5

      - name: Generated blocks are up to date
        run: python tools/generate_docs.py --check

      - name: Cross-file consistency
        run: python tools/validate_repo.py

      - name: Monitor unit tests (offline)
        run: python -m unittest discover -s tests -v
